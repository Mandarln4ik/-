name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    # Secrets are lifted into the job environment because the `secrets` context is not
    # available in a step's `if:` - testing `env.` is the pattern that actually works.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      # No explicit ref: a tag push checks out the tag, a manual dispatch checks out the
      # branch it was dispatched on. The release step below then creates the tag at that
      # commit, so a release can be cut without push access to refs/tags.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK, so it only needs the right platform
      # installed. Done directly rather than through android-actions/setup-android, which
      # installs the legacy `tools` package that Google has removed from the SDK repository
      # - that action fails outright on current cmdline-tools.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Gate the release on the tests. A tag that ships broken sampler maths is worse than
      # a tag that fails to publish.
      - name: Run core unit tests
        working-directory: core
        run: ./gradlew test --no-daemon

      # Signing is optional. With the secrets present the release APK is signed and
      # upgradable in place; without them it still builds, and the notes say it is unsigned
      # rather than shipping something that looks installable and is not.
      - name: Decode keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # Debug-signed as well: it installs with `adb install` straight away, which is what
      # anyone testing NPU support on their own phone actually needs.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NeuroForge ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*.apk
          fail_on_unmatched_files: true
