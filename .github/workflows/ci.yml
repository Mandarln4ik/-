name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: Core tests (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # `core` is a standalone Kotlin/JVM build on purpose: the scheduler maths, tiling
      # geometry and latent packing are where a bug corrupts an image instead of crashing,
      # and they are testable without an emulator or an SDK.
      - name: Run core unit tests
        working-directory: core
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK, so it only needs the right platform
      # installed. Done directly rather than through android-actions/setup-android, which
      # installs the legacy `tools` package that Google has removed from the SDK repository
      # - that action fails outright on current cmdline-tools.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

  catalogue:
    name: Catalogue URLs resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A catalogue entry is a claim about someone else's repository. The authoring
      # environment cannot reach Hugging Face, so that claim went untested three times and
      # every time it failed on a real phone. CI can reach it, so the check lives here — and
      # it runs the same resolution the device runs, rather than a stricter one that would
      # fail entries which actually work.
      - name: Resolve every catalogued download
        working-directory: core
        run: ./gradlew --quiet --console=plain probeCatalog

  smoke:
    name: App launches on an emulator
    runs-on: ubuntu-latest
    # The check that would have caught the v1.1.0 launch crash. An initialiser-order fault
    # compiles without a warning, so assembling the APK proves nothing about whether it
    # opens; only starting it does.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      # KVM is what makes an x86_64 emulator usable rather than glacial.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the app and watch for a crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Plain `sh`, not bash: the action runs this script with /usr/bin/sh, so `set -o
          # pipefail` is a syntax error that fails the step before the app is ever installed
          # - which looked exactly like a launch crash in the log.
          script: |
            set -u
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n dev.neuroforge/.MainActivity
            sleep 12

            # Two independent signals, because either alone lies: a crash dialog can be
            # dismissed leaving the process alive, and a process can die silently.
            if adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*dev\.neuroforge"; then
              echo "::error::The app crashed on launch"
              adb logcat -d | grep -A 40 "FATAL EXCEPTION" | head -60
              exit 1
            fi
            if [ -z "$(adb shell pidof dev.neuroforge)" ]; then
              echo "::error::The app is not running 12s after launch"
              adb logcat -d | tail -80
              exit 1
            fi
            echo "app is alive"
